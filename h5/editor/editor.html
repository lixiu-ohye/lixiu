<!-- ═══════════════════ 【剪辑工作台】视图(编辑器主体) ═══════════════════ -->
<div id="viewEditor" class="editor-root">
  <!-- 顶部工具栏: 工程名/新建/导入/导出/撤销重做 -->
  <div class="ed-toolbar">
    <input id="edName" class="pj" value="未命名工程" title="工程名称">
    <button class="ed-btn" id="edNew">新建工程</button>
    <span class="ed-sep"></span>
    <button class="ed-btn" id="edImportMat">导入素材</button>
    <button class="ed-btn" id="edImportPrj">导入工程(.lixiu)</button>
    <button class="ed-btn primary" id="edExportPrj">导出工程 Ctrl+S</button>
    <button class="ed-btn" id="edExportFrame">导出当前帧</button>
    <span class="ed-sep"></span>
    <button class="ed-btn" id="edUndo" title="Ctrl+Z">↶ 撤销</button>
    <button class="ed-btn" id="edRedo" title="Ctrl+Y">↷ 重做</button>
    <span style="margin-left:auto;color:#6f7686;font-size:11px">空格播放 · S分割 · Del删除 · Ctrl+Z/Y撤销重做 · 滚轮缩放画布</span>
    <input type="file" id="edMatFile" multiple accept="video/*,image/*,audio/*" style="display:none">
    <input type="file" id="edPrjFile" accept=".lixiu" style="display:none">
  </div>

  <div class="ed-middle">
    <div class="ed-left">
      <!-- 画布预览区: Canvas 合成渲染, 滚轮缩放/拖拽平移 -->
      <div class="ed-canvas-wrap" id="edWrap" title="滚轮缩放 · 拖拽平移 · 双击复位">
        <canvas id="edCanvas" width="1280" height="720"></canvas>
      </div>
      <!-- 播放控制条 -->
      <div class="ed-transport">
        <button class="ed-btn" id="edToStart" title="到片头">⏮</button>
        <button class="ed-btn" id="edPrevFrame" title="逐帧后退(←)">◀帧</button>
        <button class="ed-btn primary" id="edPlay" style="min-width:60px">▶ 播放</button>
        <button class="ed-btn" id="edNextFrame" title="逐帧前进(→)">帧▶</button>
        <button class="ed-btn" id="edToEnd" title="到片尾">⏭</button>
        <span class="ed-time" id="edTime">00:00.0 / 00:00.0</span>
        <span class="ed-sep"></span>
        <button class="ed-btn" id="edMark" title="在播放头处打标记">🚩 打点</button>
        <button class="ed-btn" id="edSplit" title="快捷键S">✂ 分割</button>
        <button class="ed-btn" id="edCopy">复制片段</button>
        <button class="ed-btn" id="edDel" title="快捷键Delete">🗑 删除</button>
        <button class="ed-btn" id="edAddSub">＋字幕片段</button>
        <button class="ed-btn" id="edLibBtn" style="margin-left:auto">📦 素材库</button>
      </div>
    </div>
    <!-- 右侧面板: 三大 Tab【属性】【进度】【UI设计】(内容由 editor.js 渲染) -->
    <div class="ed-right" id="edRight">
      <div class="ed-rtabs" id="edRTabs">
        <button data-rtab="props" class="on">属性</button>
        <button data-rtab="progress">进度</button>
        <button data-rtab="ui">UI设计</button>
      </div>

      <!-- ── Tab 1【属性】: 选中片段/工程属性(renderProps() 渲染) ── -->
      <div class="rt-pane on" id="rt-props">
        <div id="edProps"></div>
      </div>

      <!-- ── Tab 2【进度】: 半自动智能进度模块(renderProgress() 渲染) ── -->
      <div class="rt-pane" id="rt-progress">
        <section class="ed-prog" id="edProg">
          <div class="pg-head" id="pgHead" title="点击折叠/展开进度面板">
            <span>📊 项目进度</span>
            <span class="pg-chip" id="pgChip">待开始</span>
            <span class="pg-pct" id="pgPct">0%</span>
            <button class="pg-toggle" id="pgFold" title="折叠/展开进度面板">▾</button>
          </div>
          <div class="pg-bar"><i id="pgFill" class="gray"></i></div>
          <div class="pg-body" id="pgBody"></div>
        </section>
      </div>

      <!-- ── Tab 3【UI设计】: 独立画布设计器(一句话生成 / 手动编辑 / 叠加到视频) ── -->
      <div class="rt-pane" id="rt-ui">
        <!-- 添加组件 -->
        <div class="ui-tools" id="uiTools">
          <button data-add="rect">矩形</button>
          <button data-add="text">文本</button>
          <button data-add="image">图片</button>
          <button data-add="button">按钮</button>
          <button data-add="card">卡片容器</button>
          <button data-add="icon">图标</button>
        </div>

        <!-- 设计画布(网格吸附 / 参考线 / 对齐 的绘制目标) -->
        <div class="ui-cv-wrap" id="uiWrap">
          <canvas id="uiCanvas" width="1080" height="1080"></canvas>
        </div>
        <div class="ui-cv-bar">
          <span>画布</span>
          <input type="number" id="uiCvW" value="1080" title="画布宽(px)"> ×
          <input type="number" id="uiCvH" value="1080" title="画布高(px)">
          <button id="uiCvApply">应用</button>
          <span class="ed-sep"></span>
          <button id="uiSnap" title="拖动时吸附到网格">网格吸附</button>
          <button id="uiGrid" title="显示网格与参考线">网格/参考线</button>
          <select id="uiGridSize" title="网格大小" style="background:#191c22;border:1px solid #333846;color:#dde1e8;border-radius:5px;padding:3px 5px;font-size:10.5px;outline:none;font-family:inherit">
            <option value="4">网格 4</option><option value="8" selected>网格 8</option><option value="16">网格 16</option><option value="24">网格 24</option>
          </select>
        </div>

        <!-- 图层列表: 显示/隐藏 · 锁定 · 层级排序 -->
        <div class="ui-sec">
          <h5>图层<span class="n" id="uiLayerCnt">0 个</span></h5>
          <div class="ui-layers" id="uiLayers"></div>
        </div>

        <!-- 选中元素属性 -->
        <div class="ui-sec">
          <h5>元素属性<span class="n" id="uiPropName"></span></h5>
          <div id="uiProps"></div>
        </div>

        <!-- 一句话生成 UI(本地解析, 不依赖后端) -->
        <div class="ui-sec">
          <h5>一句话生成 UI</h5>
          <textarea class="ui-prompt" id="uiPrompt" placeholder="例：1080x1080 方形，深色底，中间大标题'星界异宠'，下面一行小字'第二幕'，底部金色圆角标签'NEW'"></textarea>
          <div class="ui-row">
            <label><input type="radio" name="uiMode" value="replace" checked> 清空重建</label>
            <label><input type="radio" name="uiMode" value="append"> 追加到现有图层</label>
          </div>
          <div class="ui-act">
            <button id="uiGen" class="primary">✨ 一键生成新UI</button>
            <button id="uiModify" title="只改指令里提到的属性, 其余保持不变">✏️ 修改选中图层</button>
          </div>
          <div class="ui-tpl" id="uiTpl">
            <button data-tpl="sub">字幕卡片</button>
            <button data-tpl="cover">封面标题</button>
            <button data-tpl="end">片尾信息卡</button>
            <button data-tpl="btn">主按钮</button>
            <button data-tpl="tag">标签组件</button>
          </div>
          <div class="ui-hist" id="uiHist"></div>
        </div>

        <!-- 输出: 导出 PNG / 叠加到视频画布 -->
        <div class="ui-act" style="margin-top:10px">
          <button class="ui-out" id="uiExportPng">导出 PNG</button>
          <button class="ui-out" id="uiToVideo" title="把当前设计作为贴纸/字幕卡片叠加到时间轴播放头处">叠加到视频画布</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部时间轴: 轨道列 + 刻度标尺 + 轨道泳道 -->
  <div class="ed-timeline">
    <div class="ed-tl-headbar">
      <button class="ed-btn" id="edAddVTrack">＋视频轨</button>
      <button class="ed-btn" id="edAddATrack">＋音频轨</button>
      <span style="color:#6f7686;font-size:11px">拖动片段移动 · 两端手柄裁剪 · 点标尺定位 · 🔒锁定 · 🔊静音</span>
    </div>
    <div class="ed-tl-main">
      <div class="ed-tracks-col">
        <div class="ed-ruler-slot">轨道</div>
        <div class="ed-tracks-scroll" id="edTrackRows"></div>
      </div>
      <div class="ed-lanes-col" id="edLanesCol">
        <div id="edRuler"></div>
        <div id="edLanes"></div>
      </div>
    </div>
  </div>

  <!-- 侧边素材库抽屉(上传/列表/拖入时间轴) -->
  <div class="ed-lib" id="edLib">
    <div class="lib-h">📦 素材库
      <button class="ed-btn" id="edLibClose" style="margin-left:auto">收起</button>
    </div>
    <div style="padding:6px">
      <button class="ed-btn primary" style="width:100%" id="edLibUpload">上传 mp4 / jpg / png / mp3</button>
    </div>
    <div class="lib-list" id="edMatList"></div>
  </div>
</div>

<!-- 悬浮提示(进度模块检测依据 tooltip, 暗色, 悬浮显示/移开消失) -->
<div class="ed-tip" id="edTip"></div>
