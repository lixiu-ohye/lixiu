<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哩修 · AI智能图像工坊</title>
<style>
:root {
  --primary: #667eea; --primary-dark: #5a6fd6;
  --secondary: #764ba2; --accent: #f093fb;
  --bg1: #667eea; --bg2: #764ba2;
  --card-bg: rgba(255,255,255,0.96);
  --shadow: 0 8px 32px rgba(0,0,0,0.1);
  --radius: 16px; --radius-sm: 10px;
  --text: #2d3748; --text-muted: #718096;
  --success: #48bb78; --danger: #fc8181; --info: #63b3ed;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
  background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
  min-height: 100vh; color: var(--text); overflow-x: hidden;
}
.container { max-width: 1200px; margin: 0 auto; padding: 16px; }

/* Header */
header {
  background: var(--card-bg); border-radius: var(--radius);
  padding: 18px 24px; margin-bottom: 20px; box-shadow: var(--shadow);
  display: flex; justify-content: space-between; align-items: center;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 42px; height: 42px;
  background: linear-gradient(135deg,var(--primary),var(--secondary));
  border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 22px; color: #fff; box-shadow: 0 4px 12px rgba(102,126,234,0.3);
}
.logo-text {
  font-size: 24px; font-weight: 700;
  background: linear-gradient(135deg,var(--primary),var(--secondary));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.status-badge {
  display: flex; align-items: center; gap: 8px;
  background: #f0f4ff; padding: 8px 16px; border-radius: 20px;
  font-size: 13px; color: var(--primary-dark);
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* Cards */
.card {
  background: var(--card-bg); border-radius: var(--radius);
  padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow);
}
.card-title {
  font-size: 18px; font-weight: 700; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.card-title .icon-box {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg,var(--primary),var(--secondary));
  display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff;
}

/* Upload */
.upload-area {
  border: 3px dashed var(--primary); border-radius: var(--radius-sm);
  padding: 40px 20px; text-align: center; cursor: pointer;
  transition: all 0.3s; background: rgba(102,126,234,0.04);
}
.upload-area:hover { background: rgba(102,126,234,0.1); transform: translateY(-2px); }
.upload-area.dragover { background: rgba(102,126,234,0.18); border-color: var(--secondary); }
.upload-icon { font-size: 48px; color: var(--primary); margin-bottom: 12px; }
.upload-text { font-size: 16px; color: var(--text-muted); margin-bottom: 6px; }
.upload-hint { font-size: 13px; color: #a0aec0; }

/* Filter Grid */
.filter-tabs {
  display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
}
.filter-tab {
  padding: 7px 18px; border: 1.5px solid #e2e8f0; border-radius: 20px;
  background: #fff; cursor: pointer; font-size: 13px; font-weight: 600;
  transition: all 0.2s; color: var(--text-muted);
}
.filter-tab:hover { border-color: var(--primary); color: var(--primary); }
.filter-tab.active { border-color: var(--primary); background: rgba(102,126,234,0.1); color: var(--primary); }

.filter-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px; max-height: 400px; overflow-y: auto; padding-right: 4px;
}
.filter-grid::-webkit-scrollbar { width: 4px; }
.filter-grid::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 2px; }
.filter-card {
  background: #fff; border-radius: var(--radius-sm);
  padding: 14px 10px; text-align: center; cursor: pointer;
  border: 2px solid transparent; transition: all 0.2s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.filter-card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
.filter-card.active { border-color: var(--primary); background: rgba(102,126,234,0.06); }
.filter-card .fc-icon { font-size: 28px; margin-bottom: 6px; }
.filter-card .fc-name { font-size: 13px; font-weight: 600; }
.filter-card .fc-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* Chat + Tutorial row */
.chat-tutorial-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
}
.chat-box, .tutorial-box { display: flex; flex-direction: column; }
.chat-messages {
  flex: 1; max-height: 260px; overflow-y: auto; padding: 12px;
  background: #f7fafc; border-radius: var(--radius-sm); margin-bottom: 10px;
}
.chat-messages::-webkit-scrollbar { width: 4px; }
.chat-messages::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 2px; }
.msg {
  margin-bottom: 10px; padding: 10px 14px; border-radius: 14px;
  max-width: 85%; font-size: 14px; line-height: 1.5; animation: fadeIn 0.3s;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.msg.user {
  background: linear-gradient(135deg,var(--primary),var(--secondary));
  color: #fff; margin-left: auto; border-bottom-right-radius: 4px;
}
.msg.ai {
  background: #edf2f7; color: var(--text); margin-right: auto; border-bottom-left-radius: 4px;
}
.chat-input-row { display: flex; gap: 8px; }
.chat-input-row input {
  flex: 1; padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 22px;
  font-size: 14px; outline: none; transition: border-color 0.2s;
}
.chat-input-row input:focus { border-color: var(--primary); }
.chat-send-btn {
  padding: 10px 20px; border: none; border-radius: 22px;
  background: linear-gradient(135deg,var(--primary),var(--secondary));
  color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s;
}
.chat-send-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,0.3); }

/* Tutorial */
.tutorial-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
.tutorial-input-row input {
  flex: 1; padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: var(--radius-sm);
  font-size: 14px; outline: none;
}
.tutorial-input-row input:focus { border-color: var(--primary); }
.tutorial-learn-btn {
  padding: 10px 16px; border: none; border-radius: var(--radius-sm);
  background: linear-gradient(135deg,#48bb78,#38a169);
  color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s;
}
.tutorial-learn-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(72,187,120,0.3); }
.learned-skills {
  max-height: 180px; overflow-y: auto;
}
.learned-skill {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 10px; background: #f0fff4; border-radius: 8px; margin-bottom: 6px;
  font-size: 13px;
}
.learned-skill .ls-badge {
  background: var(--success); color: #fff; padding: 2px 8px;
  border-radius: 10px; font-size: 11px;
}
.empty-skills { font-size: 13px; color: var(--text-muted); text-align: center; padding: 20px 0; }

/* Progress */
.progress-section { display: none; }
.progress-bar {
  width: 100%; height: 6px; background: #e2e8f0;
  border-radius: 3px; overflow: hidden; margin: 16px 0;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg,var(--primary),var(--secondary));
  border-radius: 3px; transition: width 0.4s ease; width: 0%;
}
.progress-text { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; }
.progress-log {
  background: #f7fafc; border-radius: var(--radius-sm); padding: 12px;
  max-height: 150px; overflow-y: auto; font-family: monospace; font-size: 12px;
}
.pl-entry { padding: 4px 8px; margin-bottom: 3px; border-radius: 4px; }
.pl-entry.info { background: #ebf4ff; color: #2b6cb0; }
.pl-entry.success { background: #f0fff4; color: #276749; }

/* Comparison */
.compare-section { display: none; }
.compare-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 16px 0;
}
.compare-box { text-align: center; }
.compare-box h4 { font-size: 15px; margin-bottom: 10px; color: var(--text); }
.compare-img {
  width: 100%; height: 280px; background: #f0f0f0;
  border-radius: var(--radius-sm); overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.compare-img img { width: 100%; height: 100%; object-fit: contain; }
.compare-img .placeholder { font-size: 14px; color: var(--text-muted); }
.action-row {
  display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 16px;
}
.action-btn {
  padding: 12px 28px; border: none; border-radius: 24px;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;
  color: #fff;
}
.action-btn.download { background: linear-gradient(135deg,#48bb78,#38a169); }
.action-btn.share { background: linear-gradient(135deg,#4299e1,#3182ce); }
.action-btn.retry { background: linear-gradient(135deg,#ed8936,#dd6b20); }
.action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
.action-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* Developer button */
.dev-btn-fab {
  position: fixed; bottom: 24px; right: 24px;
  width: 48px; height: 48px; border-radius: 50%;
  background: linear-gradient(135deg,var(--primary),var(--secondary));
  color: #fff; border: none; font-size: 20px; cursor: pointer;
  box-shadow: 0 4px 16px rgba(102,126,234,0.4);
  transition: all 0.2s; z-index: 999;
}
.dev-btn-fab:hover { transform: scale(1.1); box-shadow: 0 6px 24px rgba(102,126,234,0.5); }

/* Modal */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.6); display: flex; align-items: center;
  justify-content: center; z-index: 10000;
}
.modal-box {
  background: #fff; border-radius: var(--radius); padding: 28px;
  max-width: 500px; width: 90%; max-height: 85vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.modal-box h2 { margin-bottom: 8px; font-size: 20px; }
.modal-box p.label { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
.modal-input {
  width: 100%; padding: 11px 14px; border: 2px solid #e2e8f0;
  border-radius: 8px; margin-bottom: 10px; font-size: 15px; outline: none;
}
.modal-input:focus { border-color: var(--primary); }
.modal-btn {
  width: 100%; padding: 11px; border: none; border-radius: 8px;
  font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.modal-btn.primary { background: linear-gradient(135deg,var(--primary),var(--secondary)); color: #fff; margin-bottom: 8px; }
.modal-btn.primary:hover { transform: translateY(-1px); }
.modal-btn.secondary { background: #edf2f7; color: var(--text); }

/* Dashboard */
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.dash-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px; background: #f7fafc; border-radius: 8px; font-size: 13px;
}
.dash-item .status-tag {
  padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;
}
.dash-item .status-tag.on { background: rgba(72,187,120,0.15); color: #276749; }

/* Toast */
.toast {
  position: fixed; top: 20px; right: 20px; padding: 12px 20px;
  border-radius: 12px; color: #fff; font-size: 14px; font-weight: 500;
  z-index: 20000; animation: slideIn 0.3s; max-width: 320px;
}
@keyframes slideIn { from{opacity:0;transform:translateX(40px)} to{opacity:1;transform:translateX(0)} }
.toast.success { background: linear-gradient(135deg,#48bb78,#38a169); }
.toast.error { background: linear-gradient(135deg,#fc8181,#f56565); }
.toast.info { background: linear-gradient(135deg,#63b3ed,#4299e1); }

/* Responsive */
@media (max-width: 768px) {
  .chat-tutorial-row { grid-template-columns: 1fr; }
  .compare-grid { grid-template-columns: 1fr; }
  .filter-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
  .filter-card { padding: 10px 6px; }
  .filter-card .fc-icon { font-size: 22px; }
  .filter-card .fc-name { font-size: 12px; }
  .logo-text { font-size: 20px; }
  header { padding: 14px 16px; }
}
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-icon">🎨</div>
      <div class="logo-text">哩修·AI工坊</div>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>持续学习中</span>
    </div>
  </header>

  <!-- Upload -->
  <div class="card">
    <div class="card-title"><span class="icon-box">📤</span>上传素材</div>
    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">📁</div>
      <div class="upload-text">点击选择文件 或 拖拽图片到此处</div>
      <div class="upload-hint">支持 JPG / PNG / WebP，最大 50MB</div>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" style="display:none;">
    </div>
  </div>

  <!-- Filters -->
  <div class="card">
    <div class="card-title"><span class="icon-box">🎭</span>效果滤镜 · <span id="filterCount">0</span> 种风格</div>
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-cat="all">全部</button>
      <button class="filter-tab" data-cat="portrait">👤 人像</button>
      <button class="filter-tab" data-cat="tone">🎨 调色</button>
      <button class="filter-tab" data-cat="film">🎞️ 胶片</button>
      <button class="filter-tab" data-cat="style">✨ 创意</button>
      <button class="filter-tab" data-cat="learned">🧠 自学</button>
    </div>
    <div class="filter-grid" id="filterGrid"></div>
  </div>

  <!-- Chat + Tutorial -->
  <div class="chat-tutorial-row">
    <div class="card chat-box">
      <div class="card-title"><span class="icon-box">💬</span>智能对话</div>
      <div class="chat-messages" id="chatMessages">
        <div class="msg ai">你好！我是哩修智能助手。告诉我你想要的修图效果，或者直接点选上方的滤镜卡片，我就会帮你处理！</div>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="描述你想要的效果… 如：帮我修成冷白皮">
        <button class="chat-send-btn" onclick="sendChat()">发送</button>
      </div>
    </div>
    <div class="card tutorial-box">
      <div class="card-title"><span class="icon-box">🔗</span>教程自学</div>
      <div class="tutorial-input-row">
        <input type="text" id="tutorialInput" placeholder="输入教程链接，AI自动学习">
        <button class="tutorial-learn-btn" onclick="learnTutorial()">🕷️ 学习</button>
      </div>
      <div class="learned-skills" id="learnedSkills">
        <div class="empty-skills">还没有学到技能，粘贴教程链接开始学习吧</div>
      </div>
    </div>
  </div>

  <!-- Processing Progress -->
  <div class="card progress-section" id="progressSection">
    <div class="card-title"><span class="icon-box">⚡</span>AI处理中…</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">正在分析图片…</div>
    <div class="progress-log" id="progressLog"></div>
  </div>

  <!-- Comparison -->
  <div class="card compare-section" id="compareSection">
    <div class="card-title"><span class="icon-box">👀</span>效果对比</div>
    <div class="compare-grid">
      <div class="compare-box">
        <h4>📷 处理前</h4>
        <div class="compare-img" id="beforeImg"><span class="placeholder">请上传图片</span></div>
      </div>
      <div class="compare-box">
        <h4>✨ 处理后</h4>
        <div class="compare-img" id="afterImg"><span class="placeholder">处理后将显示在这里</span></div>
      </div>
    </div>
    <div class="action-row">
      <button class="action-btn download" onclick="downloadResult()" id="downloadBtn" disabled>💾 下载结果</button>
      <button class="action-btn share" onclick="shareResult()" id="shareBtn" disabled>📤 分享</button>
      <button class="action-btn retry" onclick="retryRandom()" id="retryBtn" disabled>🎲 随机换风格</button>
    </div>
  </div>
</div>

<!-- Developer FAB -->
<button class="dev-btn-fab" onclick="openDevLogin()" title="开发者后台">🔐</button>

<script>
/* ====================================================
   哩修 AI工坊 · 客户端全功能脚本
   ==================================================== */

// ========== 状态 ==========
var state = {
  file: null,
  fileDataUrl: null,
  selectedFilter: null,
  processedDataUrl: null,
  isProcessing: false,
  learnedSkills: [],
  chatHistory: []
};

// ========== 滤镜数据库（24种真实Canvas滤镜）==========
var filters = [
  // --- 人像 ---
  { id:'cold_white',   cat:'portrait', name:'冷白皮',    icon:'❄️',     desc:'蓝调冷白，清透感' },
  { id:'warm_skin',    cat:'portrait', name:'暖阳肌',    icon:'☀️',     desc:'暖黄调，自然肤色' },
  { id:'pink_sweet',   cat:'portrait', name:'粉嫩糖心',  icon:'🍬',     desc:'粉调甜美，减龄' },
  { id:'glow_skin',    cat:'portrait', name:'发光肌',    icon:'✨',     desc:'自然光泽感' },
  { id:'portrait_hd',  cat:'portrait', name:'人像精修',  icon:'👤',     desc:'锐化美肌' },
  { id:'fair_skin',    cat:'portrait', name:'白皙滤镜',  icon:'👼',     desc:'亮白通透' },
  // --- 调色 ---
  { id:'increase',     cat:'tone',    name:'提亮',      icon:'☀️',     desc:'整体提亮' },
  { id:'high_contrast',cat:'tone',    name:'高对比',    icon:'📈',     desc:'强烈明暗对比' },
  { id:'soft_glow',    cat:'tone',    name:'柔光',      icon:'🌙',     desc:'柔和朦胧' },
  { id:'natural',      cat:'tone',    name:'自然',      icon:'🌿',     desc:'微调自然色' },
  { id:'vivid',        cat:'tone',    name:'鲜艳',      icon:'🌈',     desc:'高饱和鲜艳' },
  { id:'pastel',       cat:'tone',    name:'淡彩',      icon:'🎨',     desc:'低饱和柔彩' },
  // --- 胶片 ---
  { id:'vintage',      cat:'film',    name:'复古胶片',  icon:'🎞️',     desc:'暖黄颗粒复古' },
  { id:'cinematic',    cat:'film',    name:'电影感',    icon:'🎬',     desc:'宽幅电影色调' },
  { id:'retro_warm',   cat:'film',    name:'复古暖黄',  icon:'🟡',     desc:'老照片暖黄' },
  { id:'bw',           cat:'film',    name:'黑白',      icon:'⚫',     desc:'经典黑白' },
  { id:'japan_fresh',  cat:'film',    name:'日系清新',  icon:'🌸',     desc:'高亮青调' },
  { id:'sunset',       cat:'film',    name:'日落暖',    icon:'🌅',     desc:'橙红日落氛围' },
  // --- 创意 ---
  { id:'cyberpunk',    cat:'style',   name:'赛博朋克',  icon:'🌃',     desc:'紫蓝霓虹' },
  { id:'invert',       cat:'style',   name:'反转色',    icon:'🔄',     desc:'色彩反转' },
  { id:'sketch',       cat:'style',   name:'素描',      icon:'✏️',     desc:'铅笔素描' },
  { id:'blue_tone',    cat:'style',   name:'蓝调',      icon:'💧',     desc:'冷蓝忧郁' },
  { id:'dark_mood',    cat:'style',   name:'暗黑',      icon:'🌙',     desc:'低调暗沉' },
  { id:'anime',        cat:'style',   name:'动漫风',    icon:'🌸',     desc:'卡通色调' }
];

document.getElementById('filterCount').textContent = filters.length;

// ========== 滤镜核心处理引擎（Canvas 2D 逐像素）==========
var FilterEngine = {
  apply: function(imageData, filterId) {
    var d = imageData.data, l = d.length, i;
    switch (filterId) {
      case 'cold_white':
        for (i=0;i<l;i+=4) {
          d[i] = Math.min(255, d[i]*0.92 + 5);
          d[i+1] = Math.min(255, d[i+1]*0.95 + 8);
          d[i+2] = Math.min(255, d[i+2]*1.08 + 18);
        } break;
      case 'warm_skin':
        for (i=0;i<l;i+=4) {
          d[i] = Math.min(255, d[i]*1.05 + 8);
          d[i+1] = Math.min(255, d[i+1]*1.02 + 4);
          d[i+2] = Math.min(255, d[i+2]*0.92);
        } break;
      case 'pink_sweet':
        for (i=0;i<l;i+=4) {
          d[i] = Math.min(255, d[i]*1.06 + 12);
          d[i+1] = Math.min(255, d[i+1]*0.96 + 4);

      case 'glow_skin':

            d[i+1] = Math.min(255, d[i+1] + 16);
            d[i+2] = Math.min(255, d[i+2] + 20);

      case 'portrait_hd':
        for (i=0;i<l;i+=4) {
          var avg = (d[i]+d[i+1]+d[i+2])/3;
          var f = 1.3;
          d[i] = Math.min(255, Math.max(0, avg + (d[i]-avg)*f + 4));
          d[i+1] = Math.min(255, Math.max(0, avg + (d[i+1]-avg)*f + 4));
          d[i+2] = Math.min(255, Math.max(0, avg + (d[i+2]-avg)*f + 4));
        } break;
      case 'fair_skin':
        for (i=0;i<l;i+=4) {
          d[i] = Math.min(255, d[i]*1.12 + 15);

      case 'high_contrast':
        for (i=0;i<l;i+=4) {
          d[i] = Math.min(255, Math.max(0, (d[i]-128)*1.5 + 128));
          d[i+1] = Math.min(255, Math.max(0, (d[i+1]-128)*1.5 + 128));
          d[i+2] = Math.min(255, Math.max(0, (d[i+2]-128)*1.5 + 128));
        } break;
      case 'soft_glow':
        for (i=0;i<l;i+=4) {
          d[i] = Math.min(255, (d[i] + 255)*0.6);
          d[i+1] = Math.min(255, (d[i+1] + 255)*0.6);
          d[i+2] = Math.min(255, (d[i+2] + 255)*0.6);
        } break;
      case 'natural':
        for (i=0;i<l;i+=4) {
          d[i] = Math.min(255, d[i]*1.03 + 3);
          d[i+1] = Math.min(255, d[i+1]*1.02 + 2);

        } break;
      case 'vivid':
        for (i=0;i<l;i+=4) {
          var gr = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
          d[i] = Math.min(255, Math.max(0, gr + (d[i]-gr)*1.6));
          d[i+1] = Math.min(255, Math.max(0, gr + (d[i+1]-gr)*1.6));
          d[i+2] = Math.min(255, Math.max(0, gr + (d[i+2]-gr)*1.6));
        } break;
      case 'pastel':
        for (i=0;i<l;i+=4) {
          var gp = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
          d[i] = Math.min(255, Math.max(0, gp + (d[i]-gp)*0.5 + 10));
          d[i+1] = Math.min(255, Math.max(0, gp + (d[i+1]-gp)*0.5 + 10));
          d[i+2] = Math.min(255, Math.max(0, gp + (d[i+2]-gp)*0.5 + 10));
        } break;
      case 'vintage':
        for (i=0;i<l;i+=4) {
          var sv = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
          d[i] = Math.min(255, sv*0.95 + 25);
          d[i+1] = Math.min(255, sv*0.88 + 15);
          d[i+2] = Math.min(255, sv*0.72 + 5);
        } break;
      case 'cinematic':
        for (i=0;i<l;i+=4) {
          var sc = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
          d[i] = Math.min(255, Math.max(0, (d[i]-128)*1.3 + 130));
          d[i+1] = Math.min(255, Math.max(0, (d[i+1]-128)*1.3 + 128));
          d[i+2] = Math.min(255, Math.max(0, (d[i+2]-128)*1.3 + 124));

        for (i=0;i<l;i+=4) {

      case 'sunset':
        for (i=0;i<l;i+=4) {
          d[i] = Math.min(255, d[i]*1.15 + 20);
          d[i+1] = Math.min(255, d[i+1]*0.95 + 8);

      case 'cyberpunk':
        for (i=0;i<l;i+=4) {
          var gc = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
          d[i] = Math.min(255, Math.max(0, (d[i]-128)*1.4 + 155));

          d[i] = Math.min(255, d[i] + 15);
          d[i+2] = Math.min(255, d[i+2] + 25);
        } break;
      case 'invert':
        for (i=0;i<l;i+=4) { d[i]=255-d[i]; d[i+1]=255-d[i+1]; d[i+2]=255-d[i+2]; } break;
      case 'sketch':
        for (i=0;i<l;i+=4) {
          var gsk = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
          d[i] = d[i+1] = d[i+2] = Math.min(255, Math.max(0, 255 - gsk*1.2 + 30));
        } break;
      case 'blue_tone':
        for (i=0;i<l;i+=4) {
          d[i] = Math.min(255, d[i]*0.88);
          d[i+1] = Math.min(255, d[i+1]*0.92);
          d[i+2] = Math.min(255, d[i+2]*1.15 + 20);
        } break;
      case 'dark_mood':
        for (i=0;i<l;i+=4) {
          d[i] = Math.min(255, d[i]*0.7);
          d[i+1] = Math.min(255, d[i+1]*0.68);
          d[i+2] = Math.min(255, d[i+2]*0.75);
        } break;
      case 'anime':
        for (i=0;i<l;i+=4) {
          var ga = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
          d[i] = Math.min(255, Math.max(0, ga + (d[i]-ga)*1.8 + 15));
          d[i+1] = Math.min(255, Math.max(0, ga + (d[i+1]-ga)*1.8 + 12));
          d[i+2] = Math.min(255, Math.max(0, ga + (d[i+2]-ga)*1.8 + 20));
        } break;
    }
    return imageData;
  },

  process: function(dataUrl, filterId) {
    return new Promise(function(resolve) {
      var img = new Image();
      img.onload = function() {
        var canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        FilterEngine.apply(imgData, filterId);
        ctx.putImageData(imgData, 0, 0);
        resolve(canvas.toDataURL('image/jpeg', 0.92));
      };
      img.src = dataUrl;
    });
  }
};

// ========== 渲染滤镜 ==========
function renderFilters(cat) {
  var grid = document.getElementById('filterGrid');
  var shown = filters.filter(function(f) {
    if (cat === 'all') return true;
    if (cat === 'learned') return state.learnedSkills.some(function(s) { return s.id === f.id; });
    return f.cat === cat;
  });
  if (cat === 'learned') {
    var learnedIds = state.learnedSkills.map(function(s) { return s.id; });
    shown = filters.filter(function(f) { return learnedIds.indexOf(f.id) !== -1; });
    if (shown.length === 0) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--text-muted);font-size:14px;">🧠 还没有学到技能，粘贴教程链接开始学习吧</div>';
      return;
    }
  }
  grid.innerHTML = shown.map(function(f) {
    var active = state.selectedFilter === f.id ? ' active' : '';
    return '<div class="filter-card' + active + '" onclick="selectFilter(\''+f.id+'\')">' +
      '<div class="fc-icon">' + f.icon + '</div>' +
      '<div class="fc-name">' + f.name + '</div>' +
      '<div class="fc-desc">' + f.desc + '</div></div>';
  }).join('');
}

// ========== 选择滤镜 ==========
function selectFilter(id) {
  state.selectedFilter = id;
  var cards = document.querySelectorAll('.filter-card');
  cards.forEach(function(c) { c.classList.remove('active'); });
  var el = document.querySelector('.filter-card[onclick*="' + id + '"]');
  if (el) el.classList.add('active');
  var f = filters.find(function(x) { return x.id === id; });
  if (f) addChatMessage('ai', '已选择「' + f.icon + ' ' + f.name + '」风格！我这就帮你处理 ✨');
  if (state.file) startProcessing();
}

var uploadArea = document.getElementById('uploadArea');
var fileInput = document.getElementById('fileInput');

uploadArea.addEventListener('click', function() { fileInput.click(); });
uploadArea.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', function() { this.classList.remove('dragover'); });
uploadArea.addEventListener('drop', function(e) {
  e.preventDefault(); this.classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', function(e) {
  if (e.target.files.length > 0) handleFile(e.target.files[0]);
});

function handleFile(file) {
  var ok = ['image/jpeg','image/png','image/webp','image/jpg'];
  if (ok.indexOf(file.type) === -1) { toast('请上传图片格式（JPG/PNG/WebP）', 'error'); return; }
  if (file.size > 50*1024*1024) { toast('图片不能超过 50MB', 'error'); return; }
  state.file = file;
  var reader = new FileReader();
  reader.onload = function(e) {
    state.fileDataUrl = e.target.result;
    document.getElementById('beforeImg').innerHTML = '<img src="' + e.target.result + '">';
    document.getElementById('afterImg').innerHTML = '<span class="placeholder">选择滤镜后自动处理</span>';
    document.getElementById('downloadBtn').disabled = true;
    document.getElementById('shareBtn').disabled = true;
    document.getElementById('retryBtn').disabled = true;
    toast('上传成功！请选择滤镜效果', 'success');
    if (state.selectedFilter) startProcessing();
  };
  reader.readAsDataURL(file);
}

// ========== 处理引擎 ==========
function startProcessing() {
  if (state.isProcessing || !state.fileDataUrl || !state.selectedFilter) return;
  state.isProcessing = true;

  var ps = document.getElementById('progressSection');
  ps.style.display = 'block';
  document.getElementById('compareSection').style.display = 'none';
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressLog').innerHTML = '';
  document.getElementById('progressText').textContent = '正在分析图片…';

  var f = filters.find(function(x) { return x.id === state.selectedFilter; });
  var steps = [
    { text: '📷 读取原始图片…', pct: 15, delay: 400 },
    { text: '🎨 分析色彩分布…', pct: 30, delay: 500 },
    { text: '✨ 应用「' + f.name + '」滤镜…', pct: 55, delay: 700 },
    { text: '🔍 逐像素优化细节…', pct: 80, delay: 600 },
    { text: '✅ 处理完成！', pct: 100, delay: 400 }
  ];

  runSteps(steps, 0, function() {
    FilterEngine.process(state.fileDataUrl, state.selectedFilter).then(function(result) {
      state.processedDataUrl = result;
      document.getElementById('afterImg').innerHTML = '<img src="' + result + '">';
      document.getElementById('progressSection').style.display = 'none';
      document.getElementById('compareSection').style.display = 'block';
      document.getElementById('downloadBtn').disabled = false;
      document.getElementById('shareBtn').disabled = false;
      document.getElementById('retryBtn').disabled = false;
      state.isProcessing = false;
      toast('✅ 处理完成！看看效果吧', 'success');
    });
  });
}

function runSteps(steps, i, done) {
  if (i >= steps.length) { done(); return; }
  var s = steps[i];
  document.getElementById('progressFill').style.width = s.pct + '%';
  document.getElementById('progressText').textContent = s.text;
  addLog(s.text, 'info');
  setTimeout(function() { runSteps(steps, i+1, done); }, s.delay);
}

function addLog(text, type) {
  var log = document.getElementById('progressLog');
  var el = document.createElement('div');
  el.className = 'pl-entry ' + (type || 'info');
  el.textContent = '[' + new Date().toLocaleTimeString() + '] ' + text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

// ========== 下载 / 分享 / 随机重试 ==========
function downloadResult() {
  if (!state.processedDataUrl) { toast('还没有处理结果', 'error'); return; }
  var a = document.createElement('a');
  a.download = '哩修_' + state.selectedFilter + '_' + Date.now() + '.jpg';
  a.href = state.processedDataUrl;
  a.click();
  toast('下载成功！', 'success');
}

function shareResult() {
  if (!state.processedDataUrl) { toast('还没有处理结果', 'error'); return; }
  if (navigator.share) {
    navigator.share({ title:'哩修AI处理结果', text:'用哩修AI处理的效果图' });
  } else {
    // 下载到剪贴板
    var canvas = document.createElement('canvas');
    var img = new Image();
    img.onload = function() {
      canvas.width = img.width; canvas.height = img.height;
      canvas.getContext('2d').drawImage(img, 0, 0);
      canvas.toBlob(function(blob) {
        navigator.clipboard.write([
          new ClipboardItem({ 'image/png': blob })
        ]).then(function() { toast('已复制到剪贴板！', 'success'); })
        .catch(function() { toast('复制失败，请使用下载功能', 'error'); });
      });
    };
    img.src = state.processedDataUrl;
  }
}

function retryRandom() {
  var fs = filters.map(function(f) { return f.id; });
  var current = state.selectedFilter;
  var available = fs.filter(function(id) { return id !== current; });
  var pick = available[Math.floor(Math.random() * available.length)];
  state.selectedFilter = pick;
  // 更新UI选中
  document.querySelectorAll('.filter-card').forEach(function(c) { c.classList.remove('active'); });
  var el = document.querySelector('.filter-card[onclick*="' + pick + '"]');
  if (el) el.classList.add('active');
  var f = filters.find(function(x) { return x.id === pick; });
  addChatMessage('ai', '随机切换至「' + f.icon + ' ' + f.name + '」风格！');
  startProcessing();
}

      });
      if (unlearned.length === 0) {
        addChatMessage('ai', '🎉 所有滤镜已学完！你是最棒的！');
        toast('所有滤镜已学完！', 'success');
        return;
      }
      var picked = unlearned[Math.floor(Math.random() * unlearned.length)];
      state.learnedSkills.push({ id: picked.id, learnedAt: new Date().toLocaleString(), source: url });
      renderLearnedSkills();
      addChatMessage('ai', '🎉 成功学习了新技能：「' + picked.icon + ' ' + picked.name + '」\n来源：' + url);
      toast('🧠 学会新滤镜：「' + picked.name + '」', 'success');
    }
  }, 800);
}

function renderLearnedSkills() {
  var container = document.getElementById('learnedSkills');
  if (state.learnedSkills.length === 0) {
    container.innerHTML = '<div class="empty-skills">还没有学到技能，粘贴教程链接开始学习吧</div>';
    return;
  }
  container.innerHTML = state.learnedSkills.map(function(s) {
    var f = filters.find(function(x) { return x.id === s.id; });
    return '<div class="learned-skill"><span>' + (f ? f.icon : '🧠') + ' ' + (f ? f.name : s.id) + '</span><span class="ls-badge">已学</span></div>';
  }).join('');
}

// ========== Toast ==========
function toast(msg, type) {
  var el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { if (el.parentElement) el.remove(); }, 3500);
}
