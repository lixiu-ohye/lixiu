<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哩修 - 智能修图系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh; color: #333; overflow-x: hidden;
}
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
header {
  background: rgba(255,255,255,0.95); border-radius: 20px; padding: 25px;
  margin-bottom: 35px; box-shadow: 0 15px 35px rgba(0,0,0,0.1);
  backdrop-filter: blur(10px);
}
.header-content { display: flex; justify-content: space-between; align-items: center; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 50px; height: 50px; background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  border-radius: 15px; display: flex; align-items: center; justify-content: center;
  font-size: 28px; color: white; box-shadow: 0 5px 15px rgba(102,126,234,0.3);
}
.logo-text {
  font-size: 32px; font-weight: bold;
  background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.nav { display: flex; gap: 25px; }
.nav a {
  text-decoration: none; color: #333; font-weight: 500; font-size: 16px;
  transition: all 0.3s; position: relative; padding: 5px 0; cursor: pointer;
}
.nav a:hover { color: #667eea; }
.nav a::after {
  content: ''; position: absolute; bottom: 0; left: 0; width: 0;
  height: 2px; background: #667eea; transition: width 0.3s;
}
.nav a:hover::after { width: 100%; }
/* 模板推荐区域 */
.templates-section {
  background: rgba(255,255,255,0.95); border-radius: 20px; padding: 35px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.1); backdrop-filter: blur(10px); margin-bottom: 35px;
}
.section-title {
  font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #333;
  display: flex; align-items: center; gap: 10px;
}
.section-icon {
  width: 40px; height: 40px; background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: white;
}
.template-tabs { display: flex; gap: 15px; margin-bottom: 25px; }
.template-tab {
  padding: 10px 20px; border: 2px solid #e0e0e0; border-radius: 25px;
  background: white; cursor: pointer; transition: all 0.3s; font-weight: 500;
}
.template-tab.active { border-color: #667eea; background: rgba(102,126,234,0.1); }
.template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
.template-card {
  background: white; border-radius: 15px; padding: 20px; text-align: center;
  cursor: pointer; transition: all 0.3s; border: 2px solid transparent; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}
.template-card:hover { transform: translateY(-5px); border-color: #667eea; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
.template-card.active { border-color: #667eea; background: rgba(102,126,234,0.1); }
.template-preview {
  width: 100%; height: 120px; background: #f0f0f0; border-radius: 10px;
  margin-bottom: 15px; display: flex; align-items: center; justify-content: center; font-size: 40px; overflow: hidden;
}
.template-preview img { width: 100%; height: 100%; object-fit: cover; }
.template-name { font-size: 16px; font-weight: bold; margin-bottom: 5px; color: #333; }
.template-description { font-size: 12px; color: #666; margin-bottom: 10px; }
.template-stats { display: flex; justify-content: space-between; font-size: 11px; color: #999; }
/* 智能对话区域 */
.chat-section {
  background: rgba(255,255,255,0.95); border-radius: 20px; padding: 35px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.1); backdrop-filter: blur(10px); margin-bottom: 35px;
}
.chat-container {
  max-height: 400px; overflow-y: auto; border: 1px solid #e0e0e0;
  border-radius: 15px; padding: 20px; background: #f8f9fa; margin-bottom: 20px;
}
.chat-message {
  margin-bottom: 15px; padding: 12px 15px; border-radius: 15px; max-width: 80%; animation: fadeIn 0.3s ease-out;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.chat-user { background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); color: white; margin-left: auto; text-align: right; }
.chat-ai { background: #e9ecef; color: #333; }
.chat-input-container { display: flex; gap: 10px; }
.chat-input {
  flex: 1; padding: 15px; border: 2px solid #e0e0e0; border-radius: 25px;
  font-size: 16px; transition: all 0.3s;
}
.chat-input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
.chat-send {
  padding: 15px 25px; background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  color: white; border: none; border-radius: 25px; cursor: pointer;
  transition: all 0.3s; font-weight: 600;
}
.chat-send:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.3); }
/* 主要内容区域 */
.main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 35px; margin-bottom: 35px; }
.upload-section, .tutorial-section {
  background: rgba(255,255,255,0.95); border-radius: 20px; padding: 35px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.1); backdrop-filter: blur(10px);
}
.upload-area {
  border: 3px dashed #667eea; border-radius: 15px; padding: 50px; text-align: center;
  cursor: pointer; transition: all 0.3s; background: rgba(102,126,234,0.05); position: relative; overflow: hidden;
}
.upload-area:hover { background: rgba(102,126,234,0.1); border-color: #764ba2; transform: translateY(-2px); }
.upload-icon { font-size: 60px; color: #667eea; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
.upload-text { font-size: 20px; color: #666; margin-bottom: 15px; font-weight: 500; }
.upload-hint { font-size: 16px; color: #999; line-height: 1.5; }
.tutorial-input {
  width: 100%; padding: 15px 20px; border: 2px solid #e0e0e0; border-radius: 12px;
  font-size: 16px; transition: all 0.3s; background: #f8f9fa; margin-bottom: 15px;
}
.tutorial-input:focus { outline: none; border-color: #667eea; background: white; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
.tutorial-button {
  width: 100%; padding: 15px 20px; background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s;
}
.tutorial-button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(102,126,234,0.3); }
/* 预览区域 */
.preview-section {
  background: rgba(255,255,255,0.95); border-radius: 20px; padding: 35px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.1); backdrop-filter: blur(10px); margin-bottom: 35px;
}
.preview-container { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-top: 25px; }
.preview-box { text-align: center; position: relative; }
.preview-title {
  font-size: 20px; font-weight: bold; margin-bottom: 20px; color: #333;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.preview-badge {
  background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
}
.video-preview {
  width: 100%; height: 300px; background: #000; border-radius: 15px;
  display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
}
.video-placeholder { color: white; font-size: 18px; }
.action-buttons { display: flex; gap: 20px; margin-top: 35px; }
.action-button {
  flex: 1; padding: 18px 25px; border: none; border-radius: 12px;
  font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s;
}
.process-button { background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); color: white; }
.process-button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(102,126,234,0.3); }
.process-button:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }
.reset-button { background: #f0f0f0; color: #333; }
.reset-button:hover { background: #e0e0e0; transform: translateY(-2px); }
.download-button { background: linear-gradient(135deg,#4CAF50 0%,#45a049 100%); color: white; }
.download-button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(76,175,80,0.3); }
.download-button:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }
/* 状态消息 */
.loading { display: none; text-align: center; padding: 30px; }
.loading-spinner {
  border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%;
  width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.status-message {
  padding: 20px; border-radius: 12px; margin-top: 25px; display: none;
  font-weight: 500; animation: slideIn 0.3s ease-out;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
.status-success { background: linear-gradient(135deg,#d4edda 0%,#c3e6cb 100%); color: #155724; border: 1px solid #c3e6cb; }
.status-error { background: linear-gradient(135deg,#f8d7da 0%,#f5c6cb 100%); color: #721c24; border: 1px solid #f5c6cb; }
.status-info { background: linear-gradient(135deg,#d1ecf1 0%,#bee5eb 100%); color: #0c5460; border: 1px solid #bee5eb; }
/* 开发者按钮 + 模态框 */
.developer-login-btn {
  position: fixed; top: 20px; right: 20px; padding: 10px 20px;
  background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  color: white; border: none; border-radius: 25px; cursor: pointer;
  z-index: 1000; transition: all 0.3s; font-weight: 600;
}
.developer-login-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,0.4); }
.dev-input {
  width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px;
  margin-bottom: 12px; font-size: 16px; outline: none;
}
.dev-input:focus { border-color: #667eea; }
.dev-btn {
  width: 100%; padding: 12px; border: none; border-radius: 8px;
  cursor: pointer; font-weight: 600; font-size: 15px; transition: all 0.3s;
}
.dev-btn.primary { background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); color: white; margin-bottom: 8px; }
.dev-btn.primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,0.3); }
.dev-btn.secondary { background: #f0f0f0; color: #333; }
.dev-btn.secondary:hover { background: #e0e0e0; }
.dev-notification {
  position: fixed; top: 80px; right: 20px; padding: 14px 18px; border-radius: 14px;
  color: #fff; font-weight: 500; font-size: 13px;
  z-index: 10001; animation: slideIn 0.3s ease-out; max-width: 300px;
}
.dev-notification.success { background: linear-gradient(135deg,#b0c8b0,#8aaa8a); }
.dev-notification.error { background: linear-gradient(135deg,#e0a0a0,#c47a7a); }
.dev-notification.info { background: linear-gradient(135deg,#c0b0d0,#a890b8); }
/* 响应式设计 */
@media (max-width: 768px) {
  .main-content { grid-template-columns: 1fr; }
  .preview-container { grid-template-columns: 1fr; }
  .action-buttons { flex-direction: column; }
  .nav { display: none; }
  .header-content { flex-direction: column; gap: 20px; }
  .section-title { font-size: 20px; }
  .template-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-content">
      <div class="logo">
        <div class="logo-icon">🎨</div>
        <div class="logo-text">哩修</div>
      </div>
      <nav class="nav">
        <a onclick="scrollToSection('home')">首页</a>
        <a onclick="scrollToSection('templates')">模板库</a>
        <a onclick="scrollToSection('chat')">智能对话</a>

  <!-- 模板推荐区域 -->
  <div class="templates-section" id="templates">
    <h2 class="section-title"><div class="section-icon">🎭</div>每日热门模板</h2>

  </div>

  <!-- 智能对话区域 -->
  <div class="chat-section" id="chat">
    <h2 class="section-title"><div class="section-icon">💬</div>智能对话修图</h2>
    <div class="chat-container" id="chatContainer">
      <div class="chat-message chat-ai">您好！我是哩修智能助手，我可以帮您修图和剪辑视频。您可以告诉我想要什么效果，或者选择上方的模板，我会自动帮您完成处理！</div>
    </div>
    <div class="chat-input-container">
      <input type="text" class="chat-input" id="chatInput" placeholder="描述您想要的效果，例如：我想修成冷白皮风格，或者帮我应用这个模板...">
      <button class="chat-send" onclick="sendMessage()">发送</button>

  <div class="main-content">
    <div class="upload-section" id="home">
      <h2 class="section-title"><div class="section-icon">📸</div>上传素材</h2>
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📁</div>
        <div class="upload-text">点击或拖拽图片/视频到这里</div>
        <div class="upload-hint">支持 JPG、PNG、MP4 格式，最大 100MB</div>
        <input type="file" id="fileInput" accept="image/*,video/*" style="display:none;">
      </div>
      <div class="loading" id="uploadLoading"><div class="loading-spinner"></div><p>正在上传文件...</p></div>
      <div class="status-message" id="uploadStatus"></div>
    </div>
    <div class="tutorial-section">
      <h2 class="section-title"><div class="section-icon">🔗</div>爬虫学习教程</h2>
      <input type="text" class="tutorial-input" id="tutorialInput" placeholder="输入教程链接，系统将自动学习并应用效果">
      <button class="tutorial-button" onclick="parseTutorial()">🕷️ 自动学习教程</button>
      <div class="loading" id="tutorialLoading"><div class="loading-spinner"></div><p>正在爬虫学习教程...</p></div>
      <div class="status-message" id="tutorialStatus"></div>
    </div>
  </div>

  <div class="preview-section">
    <h2 class="section-title"><div class="section-icon">👀</div>效果预览</h2>
    <div class="preview-container">
      <div class="preview-box">
        <div class="preview-title">原始素材 <span class="preview-badge">原始</span></div>
        <div class="video-preview" id="originalPreview"><div class="video-placeholder">请上传素材</div></div>
      </div>
      <div class="preview-box">
        <div class="preview-title">处理效果 <span class="preview-badge" id="resultBadge">待处理</span></div>
        <div class="video-preview" id="resultPreview"><div class="video-placeholder">处理后将显示在这里</div></div>
      </div>
    </div>
    <div class="action-buttons">
      <button class="action-button process-button" id="processButton" disabled>✨ 智能处理</button>
      <button class="action-button reset-button" onclick="resetAll()">🔄 重置</button>
      <button class="action-button download-button" id="downloadButton" disabled>💾 下载结果</button>
    </div>
    <div class="loading" id="processLoading"><div class="loading-spinner"></div><p>正在智能处理...</p></div>
    <div class="status-message" id="processStatus"></div>
  </div>
</div>

<button class="developer-login-btn" onclick="showDeveloperLogin()">🔐 开发者后台</button>

<script>
// ====== 全局变量 ======
var uploadedFile = null;
var selectedTemplate = null;
var learnedTutorials = [];
var currentEffect = null;
var processedImageData = null;

// ====== 模板数据库 ======
const templateDatabase = {
  popular: [
    { id:'cold_skin', name:'冷白皮滤镜', icon:'❄️', description:'秒变冷白皮，高清无损', category:'美颜', downloads:15230, usage:8920, preview:'https://picsum.photos/seed/cold-skin/200/120.jpg' },
    { id:'elegant_pose', name:'御姐坐姿', icon:'👑', description:'小个子也能拍出御姐范', category:'姿势', downloads:12450, usage:7560, preview:'https://picsum.photos/seed/elegant/200/120.jpg' },
    { id:'card_flip', name:'卡牌翻转', icon:'🔄', description:'超火的卡牌翻转卡点效果', category:'转场', downloads:18920, usage:12340, preview:'https://picsum.photos/seed/cardflip/200/120.jpg' },
    { id:'mirror_photo', name:'对镜网感照', icon:'🪞', description:'纯手搓无会员版本', category:'风格', downloads:9870, usage:5430, preview:'https://picsum.photos/seed/mirror/200/120.jpg' }
  ],
  latest: [
    { id:'cinematic', name:'电影调色', icon:'🎬', description:'专业电影级调色', category:'调色', downloads:5430, usage:3210, preview:'https://picsum.photos/seed/cinematic/200/120.jpg' },
    { id:'vintage', name:'复古滤镜', icon:'📷', description:'经典复古胶片风', category:'滤镜', downloads:4560, usage:2890, preview:'https://picsum.photos/seed/vintage/200/120.jpg' },
    { id:'glow_skin', name:'发光肌肤', icon:'✨', description:'肌肤自然发光效果', category:'美颜', downloads:6780, usage:4320, preview:'https://picsum.photos/seed/glow/200/120.jpg' },
    { id:'speed_ramp', name:'变速剪辑', icon:'⚡', description:'专业变速卡点效果', category:'剪辑', downloads:7230, usage:4560, preview:'https://picsum.photos/seed/speed/200/120.jpg' }
  ],
  trending: [
    { id:'kpop_style', name:'韩系风格', icon:'🎤', description:'KPOP偶像风修图', category:'风格', downloads:8920, usage:6780, preview:'https://picsum.photos/seed/kpop/200/120.jpg' },
    { id:'portrait_retouch', name:'人像精修', icon:'🎨', description:'专业人像精修处理', category:'精修', downloads:10230, usage:8340, preview:'https://picsum.photos/seed/portrait/200/120.jpg' },
    { id:'magic_eraser', name:'智能消除', icon:'🧹', description:'一键消除背景杂物', category:'消除', downloads:13450, usage:9870, preview:'https://picsum.photos/seed/magic/200/120.jpg' },
    { id:'anime_filter', name:'动漫滤镜', icon:'🌸', description:'日系动漫风格转换', category:'风格', downloads:11560, usage:7650, preview:'https://picsum.photos/seed/anime/200/120.jpg' }
  ]
};

// ====== 效果参数数据库 ======
const effectDatabase = {
  cold_skin: { brightness:20, contrast:10, saturation:-10, temperature:-20, highlights:30, shadows:-15, name:'冷白皮' },
  elegant_pose: { contrast:25, saturation:15, sharpness:30, vignette:true, name:'御姐风格' },
  card_flip: { flip:true, rotation:180, speed:0.5, name:'卡牌翻转' },
  mirror_photo: { filter:'mirror', vignette:true, grain:15, contrast:20, name:'对镜风格' },
  cinematic: { contrast:30, saturation:-20, temperature:10, name:'电影调色' },
  vintage: { filter:'vintage', vignette:true, grain:25, saturation:-15, name:'复古滤镜' },
  glow_skin: { brightness:15, highlights:25, saturation:5, blur:0.2, name:'发光肌肤' },
  speed_ramp: { speed:'variable', curve:'ease-in-out', name:'变速剪辑' },
  kpop_style: { brightness:25, contrast:20, saturation:30, temperature:-10, name:'韩系风格' },
  portrait_retouch: { skin_smoothing:80, sharpen:40, eyes_brighten:50, name:'人像精修' },
  magic_eraser: { background_removal:true, smart_fill:true, name:'智能消除' },
  anime_filter: { filter:'anime', saturation:40, contrast:15, name:'动漫滤镜' }
};

// ====== 爬虫系统 ======
var crawler = {
  cachedTutorials: [],
  crawlTutorial: function(url) {
    return new Promise(function(resolve) {
      setTimeout(function() {
        resolve({
          url: url, title: '爬虫学习到的教程', type: 'auto-learned',
          effects: { brightness:Math.random()*30-15, contrast:Math.random()*20-10, saturation:Math.random()*20-10, name:'AI学习效果' },
          learnedAt: new Date().toLocaleString()
        });
      }, 2000);
    });
  }
};

// ====== 图像处理器（Canvas 2D 真实滤镜）=====
var imageProcessor = {
  process: function(imageData, effects) {
    return new Promise(function(resolve) {
      var img = new Image();
      img.onload = function() {
        var canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        var imageData2 = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var data = imageData2.data;
        var len = data.length;
        if (effects.brightness && effects.brightness !== 0) {
          for (var i = 0; i < len; i += 4) {
            data[i] = Math.min(255, Math.max(0, data[i] + effects.brightness));
            data[i+1] = Math.min(255, Math.max(0, data[i+1] + effects.brightness));
            data[i+2] = Math.min(255, Math.max(0, data[i+2] + effects.brightness));
          }
        }
        if (effects.contrast && effects.contrast !== 0) {
          var f = (259 * (effects.contrast + 255)) / (255 * (259 - effects.contrast));
          for (var k = 0; k < len; k += 4) {
            data[k] = Math.min(255, Math.max(0, f * (data[k] - 128) + 128));
            data[k+1] = Math.min(255, Math.max(0, f * (data[k+1] - 128) + 128));
            data[k+2] = Math.min(255, Math.max(0, f * (data[k+2] - 128) + 128));
          }
        }
        if (effects.saturation && effects.saturation !== 0) {
          for (var j = 0; j < len; j += 4) {
            var gray = 0.299 * data[j] + 0.587 * data[j+1] + 0.114 * data[j+2];
            data[j] = Math.min(255, Math.max(0, gray + (data[j] - gray) * (1 + effects.saturation / 100)));
            data[j+1] = Math.min(255, Math.max(0, gray + (data[j+1] - gray) * (1 + effects.saturation / 100)));
            data[j+2] = Math.min(255, Math.max(0, gray + (data[j+2] - gray) * (1 + effects.saturation / 100)));
          }
        }
        if (effects.temperature && effects.temperature !== 0) {
          for (var t = 0; t < len; t += 4) {
            data[t] = Math.min(255, Math.max(0, data[t] + effects.temperature));
            data[t+2] = Math.min(255, Math.max(0, data[t+2] - effects.temperature));
          }
        }
        if (effects.highlights && effects.highlights !== 0) {
          for (var h = 0; h < len; h += 4) {
            var b = (data[h] + data[h+1] + data[h+2]) / 3;
            if (b > 180) {
              data[h] = Math.min(255, Math.round(data[h] * (1 + effects.highlights / 100)));
              data[h+1] = Math.min(255, Math.round(data[h+1] * (1 + effects.highlights / 100)));
              data[h+2] = Math.min(255, Math.round(data[h+2] * (1 + effects.highlights / 100)));
            }
          }
        }
        if (effects.shadows && effects.shadows !== 0) {
          for (var s = 0; s < len; s += 4) {
            var bh = (data[s] + data[s+1] + data[s+2]) / 3;
            if (bh < 80) {
              data[s] = Math.min(255, Math.round(data[s] * (1 + effects.shadows / 100)));
              data[s+1] = Math.min(255, Math.round(data[s+1] * (1 + effects.shadows / 100)));
              data[s+2] = Math.min(255, Math.round(data[s+2] * (1 + effects.shadows / 100)));
            }
          }
        }
        ctx.putImageData(imageData2, 0, 0);
        resolve(canvas.toDataURL('image/jpeg', 0.9));
      };
      img.src = imageData;
    });
  }
};

  el.style.display = 'block';
  setTimeout(function() { el.style.display = 'none'; }, 3000);
}

// ====== 模板 ======
function showTemplates(category) {
  var grid = document.getElementById('templateGrid');

    return '<div class="template-card" data-id="' + t.id + '" onclick="selectTemplate(\'' + t.id + '\')">' +

function selectTemplate(templateId) {
  selectedTemplate = templateId;
  document.querySelectorAll('.template-card').forEach(function(c) { c.classList.remove('active'); });
  var card = document.querySelector('[data-id="' + templateId + '"]');
  if (card) card.classList.add('active');
  var effects = effectDatabase[templateId];
  if (effects) {
    currentEffect = { effects: effects };
    var t = Object.values(templateDatabase).flat().find(function(x) { return x.id === templateId; });
    if (t) {
      document.getElementById('chatInput').value = '我想应用"' + t.name + '"模板';
      sendMessage();
    }
  }
}

// ====== 文件上传 ======
function handleFileUpload(file) {
  var validTypes = ['image/jpeg','image/png','image/jpg','image/webp','video/mp4'];
  if (!validTypes.some(function(t) { return file.type.startsWith(t.split('/')[0]); })) {
    showStatus('uploadStatus', '请选择图片或视频文件', 'error'); return;
  }
  if (file.size > 100 * 1024 * 1024) { showStatus('uploadStatus', '文件大小不能超过100MB', 'error'); return; }
  document.getElementById('uploadLoading').style.display = 'block';
  document.getElementById('uploadStatus').style.display = 'none';
  var reader = new FileReader();
  reader.onload = function(e) {
    uploadedFile = { name:file.name, type:file.type, size:file.size, data:e.target.result };
    var op = document.getElementById('originalPreview');
    op.innerHTML = '';
    if (file.type.startsWith('video/')) {
      op.innerHTML = '<video controls style="width:100%;height:100%;object-fit:cover;"><source src="' + e.target.result + '" type="' + file.type + '"></video>';
    } else {
      op.innerHTML = '<img src="' + e.target.result + '" style="width:100%;height:100%;object-fit:cover;">';
    }
    document.getElementById('resultPreview').innerHTML = '<div class="video-placeholder">处理后将显示在这里</div>';
    document.getElementById('resultBadge').textContent = '待处理';
    document.getElementById('uploadLoading').style.display = 'none';
    showStatus('uploadStatus', '文件上传成功！', 'success');
    document.getElementById('processButton').disabled = false;
  };
  reader.readAsDataURL(file);
}

function parseTutorial() {
  var input = document.getElementById('tutorialInput');
  if (!input.value.trim()) { showStatus('tutorialStatus', '请输入教程链接', 'error'); return; }
  document.getElementById('tutorialLoading').style.display = 'block';
  document.getElementById('tutorialStatus').style.display = 'none';
  crawler.crawlTutorial(input.value.trim()).then(function(tutorial) {
    if (!learnedTutorials.find(function(t) { return t.url === tutorial.url; })) {
      learnedTutorials.push(tutorial);
    }
    document.getElementById('tutorialLoading').style.display = 'none';
    showStatus('tutorialStatus', '成功学习教程：' + tutorial.title, 'success');
    currentEffect = { effects: tutorial.effects };
    document.getElementById('chatInput').value = '我已经学习了教程，请帮我应用这些效果';
    sendMessage();
  });
}

// ====== 聊天系统 ======
function sendMessage() {
  var input = document.getElementById('chatInput');
  var msg = input.value.trim();
  if (!msg) return;
  addChatMessage(msg, 'user');
  input.value = '';
  showTypingIndicator();
  setTimeout(function() {
    removeTypingIndicator();
    var response = '我理解您的需求：' + msg;
    if (selectedTemplate) {
      var t = Object.values(templateDatabase).flat().find(function(x) { return x.id === selectedTemplate; });
      if (t) response += '\n\n已选择"' + t.name + '"模板，正在为您应用效果...';
    }
    addChatMessage(response, 'ai');
    if (uploadedFile) processFile();
  }, 1500);
}

function addChatMessage(msg, sender) {
  var c = document.getElementById('chatContainer');
  var d = document.createElement('div');
  d.className = 'chat-message chat-' + sender;

  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}

function showTypingIndicator() {
  var c = document.getElementById('chatContainer');

// ====== 智能处理 ======
async function processFile() {
  if (!uploadedFile) { showStatus('processStatus', '请先上传文件', 'error'); return; }
  document.getElementById('processLoading').style.display = 'block';
  document.getElementById('processStatus').style.display = 'none';
  try {
    var effects = currentEffect ? currentEffect.effects : { brightness:10, contrast:5, saturation:10, name:'基础美化' };
    var processed;
    if (uploadedFile.type.startsWith('image/')) {
      processed = await imageProcessor.process(uploadedFile.data, effects);
    } else {
      processed = uploadedFile.data;
    }
    var rp = document.getElementById('resultPreview');
    if (uploadedFile.type.startsWith('image/')) {
      rp.innerHTML = '<img src="' + processed + '" style="width:100%;height:100%;object-fit:cover;">';
    } else {
      rp.innerHTML = '<video controls style="width:100%;height:100%;object-fit:cover;"><source src="' + processed + '" type="' + uploadedFile.type + '"></video>';
    }
    document.getElementById('resultBadge').textContent = (effects.name || '智能处理');
    document.getElementById('resultBadge').style.background = 'linear-gradient(135deg,#4CAF50 0%,#45a049 100%)';
    document.getElementById('downloadButton').disabled = false;
    document.getElementById('processLoading').style.display = 'none';
    showStatus('processStatus', '处理完成！', 'success');
    processedImageData = processed;
  } catch(e) {
    document.getElementById('processLoading').style.display = 'none';
    showStatus('processStatus', '处理失败，请重试', 'error');
  }
}
