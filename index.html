<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh; color: #333; overflow-x: hidden;
}
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }
/* 头部 */
header {
  background: rgba(255,255,255,0.95); border-radius: 20px; padding: 25px; margin-bottom: 30px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.1); backdrop-filter: blur(10px);
  display: flex; justify-content: space-between; align-items: center;
}
.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 50px; height: 50px; background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  border-radius: 15px; display: flex; align-items: center; justify-content: center;
  font-size: 28px; color: white; box-shadow: 0 5px 15px rgba(102,126,234,0.3);
}
.logo-text {
  font-size: 32px; font-weight: bold;
  background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.status-indicator {
  display: flex; align-items: center; gap: 15px;
  background: rgba(255,255,255,0.9); padding: 10px 20px; border-radius: 25px; font-size: 14px;
}
.status-dot { width: 10px; height: 10px; border-radius: 50%; background: #4CAF50; animation: pulse 2s infinite; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
/* 主要内容 */
.main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px; }
/* 上传区域 */
.upload-section {
  grid-column: 1 / -1; background: rgba(255,255,255,0.95); border-radius: 20px;
  padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); backdrop-filter: blur(10px);
}
.upload-area {
  border: 3px dashed #667eea; border-radius: 15px; padding: 50px; text-align: center;
  cursor: pointer; transition: all 0.3s; background: rgba(102,126,234,0.05); position: relative;
}
.upload-area:hover { background: rgba(102,126,234,0.1); border-color: #764ba2; transform: translateY(-2px); }
.upload-icon { font-size: 60px; color: #667eea; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
.upload-text { font-size: 20px; color: #666; margin-bottom: 10px; font-weight: 500; }
.upload-hint { font-size: 16px; color: #999; }
/* 模板推荐 */
.templates-section {
  grid-column: 1 / -1; background: rgba(255,255,255,0.95); border-radius: 20px;
  padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); backdrop-filter: blur(10px);
}
.template-tabs {
  display: flex; gap: 15px; margin-bottom: 25px;
  border-bottom: 2px solid #f0f0f0; padding-bottom: 15px;
}
.template-tab {
  padding: 10px 20px; border: none; background: none; cursor: pointer;
  font-weight: 500; color: #666; transition: all 0.3s; position: relative;
}
.template-tab.active { color: #667eea; }
.template-tab.active::after {
  content: ''; position: absolute; bottom: -15px; left: 0;
  width: 100%; height: 3px; background: #667eea; border-radius: 3px;
}
.template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
.template-card {
  background: white; border-radius: 15px; overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: all 0.3s; cursor: pointer; position: relative;
}
.template-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
.template-card.active { border: 2px solid #667eea; }
.template-preview { width: 100%; height: 150px; background: #f8f9fa; position: relative; overflow: hidden; }
.template-preview img { width: 100%; height: 100%; object-fit: cover; }
.template-info { padding: 15px; }
.template-name { font-size: 16px; font-weight: bold; margin-bottom: 5px; color: #333; }
.template-description { font-size: 14px; color: #666; margin-bottom: 10px; }
.template-meta { display: flex; justify-content: space-between; font-size: 12px; color: #999; }
.template-badge {
  position: absolute; top: 10px; right: 10px;
  background: rgba(102,126,234,0.9); color: white;
  padding: 4px 8px; border-radius: 20px; font-size: 11px; font-weight: 600;
}
/* 功能选择 */
.feature-section {
  background: rgba(255,255,255,0.95); border-radius: 20px;
  padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); backdrop-filter: blur(10px);
}
.feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
.feature-card {
  background: white; border-radius: 15px; padding: 25px; text-align: center;
  cursor: pointer; transition: all 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.1); position: relative; overflow: hidden;
}
.feature-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
.feature-card.active { border: 2px solid #667eea; background: rgba(102,126,234,0.1); }
.feature-icon { font-size: 40px; margin-bottom: 15px; }
.feature-name { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #333; }
.feature-desc { font-size: 14px; color: #666; margin-bottom: 15px; }
.feature-badge {
  position: absolute; top: 10px; right: 10px;
  background: linear-gradient(135deg,#4CAF50 0%,#45a049 100%); color: white;
  padding: 4px 8px; border-radius: 20px; font-size: 11px; font-weight: 600;
}
/* 学习状态 */
.learning-section {
  grid-column: 1 / -1; background: rgba(255,255,255,0.95); border-radius: 20px;
  padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); backdrop-filter: blur(10px);
}
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
.stat-card { background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); color: white; padding: 20px; border-radius: 15px; text-align: center; }
.stat-value { font-size: 32px; font-weight: bold; margin-bottom: 5px; }
.stat-label { font-size: 14px; opacity: 0.9; }
/* 进度区域 */
.progress-section {
  grid-column: 1 / -1; background: rgba(255,255,255,0.95); border-radius: 20px;
  padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); backdrop-filter: blur(10px); display: none;
}
.progress-bar { width: 100%; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; margin: 20px 0; }
.progress-fill { height: 100%; background: linear-gradient(90deg,#667eea 0%,#764ba2 100%); border-radius: 4px; transition: width 0.3s ease; width: 0%; }
.log-area { background: #f8f9fa; border-radius: 10px; padding: 15px; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; }
.log-entry { margin-bottom: 5px; padding: 5px; border-radius: 5px; }
.log-info { background: #e3f2fd; color: #1976d2; }
.log-success { background: #e8f5e8; color: #2e7d32; }
.log-error { background: #ffebee; color: #c62828; }
/* 结果区域 */
.result-section {
  grid-column: 1 / -1; background: rgba(255,255,255,0.95); border-radius: 20px;
  padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); backdrop-filter: blur(10px); display: none;
}
.comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin: 30px 0; }
.comparison-box { text-align: center; }
.comparison-box h3 { margin-bottom: 15px; color: #333; }
.comparison-image {
  width: 100%; height: 300px; background: #f0f0f0;
  border-radius: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.comparison-image img { width: 100%; height: 100%; object-fit: cover; }
.action-buttons { display: flex; gap: 15px; justify-content: center; margin-top: 30px; }
.action-button {
  padding: 15px 30px; border: none; border-radius: 25px;
  font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; color: white;

.download-btn { background: linear-gradient(135deg,#4CAF50 0%,#45a049 100%); }
.share-btn { background: linear-gradient(135deg,#2196F3 0%,#1976D2 100%); }
.retry-btn { background: linear-gradient(135deg,#FF9800 0%,#F57C00 100%); }
.action-button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }

.developer-login-btn {

.dev-input {

.dev-btn {

.dev-btn.primary { background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); color: white; margin-bottom: 8px; }

.dev-notification.success { background: linear-gradient(135deg,#b0c8b0,#8aaa8a); }
.dev-notification.error { background: linear-gradient(135deg,#e0a0a0,#c47a7a); }
.dev-notification.info { background: linear-gradient(135deg,#c0b0d0,#a890b8); }
/* 响应式 */
@media (max-width: 768px) {

// ====== 初始化 ======
document.addEventListener('DOMContentLoaded', function() {
  initUpload();
  showTemplates('all');
  initTemplateTabs();
  simulateLearning();
});

// ====== 上传 ======
function initUpload() {
  var uploadArea = document.getElementById('uploadArea');
  var fileInput = document.getElementById('fileInput');
  uploadArea.addEventListener('click', function() { fileInput.click(); });
  uploadArea.addEventListener('dragover', function(e) { e.preventDefault(); uploadArea.style.background = 'rgba(102,126,234,0.2)'; });
  uploadArea.addEventListener('dragleave', function() { uploadArea.style.background = 'rgba(102,126,234,0.05)'; });
  uploadArea.addEventListener('drop', function(e) {
    e.preventDefault();
    uploadArea.style.background = 'rgba(102,126,234,0.05)';
    if (e.dataTransfer.files.length > 0) handleFileUpload(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', function(e) { if (e.target.files.length > 0) handleFileUpload(e.target.files[0]); });
}

function initTemplateTabs() {
  var tabs = document.querySelectorAll('.template-tab');
  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      tabs.forEach(function(t) { t.classList.remove('active'); });
      this.classList.add('active');
      showTemplates(this.dataset.category);
    });
  });
}

// ====== 模板 ======
function showTemplates(category) {
  var grid = document.getElementById('templateGrid');
  var templates = templateDatabase[category] || templateDatabase.all;
  grid.innerHTML = templates.map(function(t) {
    return '<div class="template-card' + (selectedTemplate === t.id ? ' active' : '') + '" data-id="' + t.id + '" onclick="selectTemplate(\'' + t.id + '\')">' +
      '<div class="template-badge">' + t.software + '</div>' +
      '<div class="template-preview"><img src="' + t.preview + '" alt="' + t.name + '"></div>' +
      '<div class="template-info"><div class="template-name">' + t.icon + ' ' + t.name + '</div>' +
      '<div class="template-description">' + t.description + '</div>' +
      '<div class="template-meta"><span>📥 ' + t.downloads.toLocaleString() + '</span><span>👤 ' + t.usage.toLocaleString() + '</span></div></div></div>';
  }).join('');
}

function selectTemplate(templateId) {
  selectedTemplate = templateId;
  document.querySelectorAll('.template-card').forEach(function(c) { c.classList.remove('active'); });
  var card = document.querySelector('[data-id="' + templateId + '"]');
  if (card) card.classList.add('active');
  if (uploadedFile) startProcessing();
}

// ====== 功能选择 ======
function selectFeature(feature) {
  selectedFeature = feature;
  var cards = document.querySelectorAll('.feature-card');
  cards.forEach(function(c) { c.classList.remove('active'); });
  event.target.closest('.feature-card').classList.add('active');
  if (uploadedFile) startProcessing();
}

// ====== 文件上传 ======
function handleFileUpload(file) {
  var validTypes = ['image/jpeg','image/png','image/jpg','image/webp','video/mp4'];
  if (!validTypes.some(function(t) { return file.type.startsWith(t.split('/')[0]); })) { alert('请选择图片或视频文件'); return; }
  if (file.size > 100 * 1024 * 1024) { alert('文件大小不能超过100MB'); return; }
  uploadedFile = file;
  var beforeImage = document.getElementById('beforeImage');
  beforeImage.innerHTML = '<img src="' + URL.createObjectURL(file) + '" alt="原图">';
  if (selectedFeature || selectedTemplate) startProcessing();
}

// ====== 开始处理 ======
async function startProcessing() {
  if (currentProcessing || !uploadedFile) return;
  currentProcessing = true;
  document.getElementById('progressSection').style.display = 'block';
  document.getElementById('resultSection').style.display = 'none';
  var steps = getProcessingSteps(selectedFeature || selectedTemplate);
  await simulateProcessing(steps);
  currentProcessing = false;
}

function getProcessingSteps(feature) {
  var steps = {
    portrait: [ { text:'正在分析人脸特征...', duration:2000, type:'info' }, { text:'加载美颜参数库...', duration:1500, type:'info' }, { text:'执行AI磨皮处理...', duration:3000, type:'info' }, { text:'应用精致美妆...', duration:2500, type:'info' }, { text:'优化整体色调...', duration:2000, type:'info' }, { text:'生成最终效果...', duration:1000, type:'success' } ],
    landscape: [ { text:'分析场景类型...', duration:2000, type:'info' }, { text:'智能调色中...', duration:3000, type:'info' }, { text:'增强天空层次...', duration:2500, type:'info' }, { text:'优化色彩平衡...', duration:2000, type:'info' }, { text:'添加氛围滤镜...', duration:1500, type:'success' } ],
    vlog: [ { text:'分析视频内容...', duration:2000, type:'info' }, { text:'自动剪辑中...', duration:4000, type:'info' }, { text:'添加转场效果...', duration:3000, type:'info' }, { text:'配乐匹配...', duration:2000, type:'info' }, { text:'导出成品...', duration:1000, type:'success' } ],
    beat: [ { text:'分析音频节拍...', duration:3000, type:'info' }, { text:'计算卡点节奏...', duration:2000, type:'info' }, { text:'自动剪辑中...', duration:4000, type:'info' }, { text:'添加特效...', duration:2000, type:'info' }, { text:'完成卡点视频...', duration:1000, type:'success' } ]
  };
  if (selectedTemplate) {
    var t = Object.values(templateDatabase).flat().find(function(x) { return x.id === selectedTemplate; });
    return [ { text:'正在应用' + t.name + '模板...', duration:2000, type:'info' }, { text:'加载参数配置...', duration:1500, type:'info' }, { text:'执行效果处理...', duration:3000, type:'info' }, { text:'优化细节调整...', duration:2500, type:'info' }, { text:'生成最终效果...', duration:1000, type:'success' } ];
  }
  return steps[feature] || steps.portrait;
}

async function simulateProcessing(steps) {
  var logArea = document.getElementById('logArea');
  var progressFill = document.getElementById('progressFill');
  var progressText = document.getElementById('progressText');
  logArea.innerHTML = '';
  progressFill.style.width = '0%';
  for (var i = 0; i < steps.length; i++) {
    var step = steps[i];
    var pct = ((i + 1) / steps.length) * 100;
    progressFill.style.width = pct + '%';
    progressText.textContent = step.text;
    var entry = document.createElement('div');
    entry.className = 'log-entry log-' + step.type;
    entry.textContent = '[' + new Date().toLocaleTimeString() + '] ' + step.text;
    logArea.appendChild(entry);
    logArea.scrollTop = logArea.scrollHeight;
    await new Promise(function(resolve) { setTimeout(resolve, step.duration); });
  }
  showResult();
}

function showResult() {
  document.getElementById('progressSection').style.display = 'none';
  document.getElementById('resultSection').style.display = 'block';
  var afterImage = document.getElementById('afterImage');
  if (selectedTemplate) {
    var t = Object.values(templateDatabase).flat().find(function(x) { return x.id === selectedTemplate; });
    afterImage.innerHTML = '<img src="' + t.preview + '" alt="效果图">';
  } else {
    afterImage.innerHTML = '<img src="https://picsum.photos/seed/processed/400/300.jpg" alt="效果图">';
  }
}

function downloadResult() {
  var link = document.createElement('a');
  var ext = uploadedFile && uploadedFile.type && uploadedFile.type.includes('video') ? '.mp4' : '.jpg';
  link.download = '哩修_' + (selectedFeature || selectedTemplate || 'processed') + '_' + Date.now() + ext;
  if (selectedTemplate) {
    var t = Object.values(templateDatabase).flat().find(function(x) { return x.id === selectedTemplate; });
    link.href = t.preview;
  } else {
    link.href = 'https://picsum.photos/seed/processed/800/600.jpg';
  }
  link.click();
  alert('下载成功！');
}

function shareResult() {
  if (navigator.share) {
    navigator.share({ title:'哩修AI处理结果', text:'使用哩修AI影像助手处理的效果图', url:window.location.href });
  } else {
    alert('分享链接已复制到剪贴板！');
  }
}

function retryWithDifferent() {
  document.getElementById('resultSection').style.display = 'none';
  document.getElementById('progressSection').style.display = 'block';
  var allTemplates = Object.values(templateDatabase).flat();
  var randomTemplate = allTemplates[Math.floor(Math.random() * allTemplates.length)];
  selectedTemplate = randomTemplate.id;
  document.querySelectorAll('.template-card').forEach(function(c) { c.classList.remove('active'); });
  var card = document.querySelector('[data-id="' + randomTemplate.id + '"]');
  if (card) card.classList.add('active');
  startProcessing();
}

function simulateLearning() {
  setInterval(function() {
    var tutorialCount = Math.floor(Math.random() * 10) + 320;
    var skillCount = Math.floor(Math.random() * 10) + 50;
    var successRate = (Math.random() * 2 + 97).toFixed(1);
    var vals = document.querySelectorAll('.stat-value');
    if (vals.length >= 3) {
      vals[0].textContent = tutorialCount;
      vals[1].textContent = skillCount;
      vals[2].textContent = successRate + '%';
    }
  }, 30000);
  setInterval(function() {
    if (Math.random() > 0.7) {
      var templates = ['冷白皮滤镜','御姐坐姿','卡牌翻转','对镜网感照','电影调色'];
      var rt = templates[Math.floor(Math.random() * templates.length)];

      n.style.cssText = 'position:fixed;top:20px;right:20px;background:linear-gradient(135deg,#4CAF50 0%,#45a049 100%);color:white;padding:15px 20px;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,0.2);z-index:1000;animation:slideIn 0.3s ease-out;';
      n.textContent = '🎉 新教程已学习: ' + rt;
      document.body.appendChild(n);
      setTimeout(function() { n.remove(); }, 5000);
    }
  }, 60000);
}

function authenticateDeveloper() {
  var user = document.getElementById('dev-username').value.trim();
  var pass = document.getElementById('dev-password').value.trim();
  if (!user || !pass) { showDevNotification('请输入账号和密码', 'error'); return; }
  if (DeveloperAuth.login(user, pass)) {
    var modals = document.querySelectorAll('div[style*="fixed"][style*="z-index:10000"]');
    modals.forEach(function(m) { m.remove(); });
    showDevNotification('登录成功！欢迎访问开发者后台', 'success');
    showDeveloperDashboard();

function showDevNotification(msg, type) {
